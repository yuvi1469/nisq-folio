# Base configuration shared by every experiment. Experiment configs extend this file.
# Relative paths are resolved against the directory containing this file (configs/).
# No paths are hardcoded in source.

paths:
  data_dir: ../data
  results_dir: ../results

# Root seed. Child seeds for each run are derived from it explicitly
# (numpy.random.SeedSequence) and passed as arguments; global RNG state is never set.
# See DECISIONS.md ADR-004.
seed: 20150101

# Fixed 30-stock universe, 5 per sector (DECISIONS.md ADR-010).
universe:
  start_date: "2015-01-01"   # inclusive
  end_date: "2023-12-31"     # inclusive
  n_stocks: 30
  n_sectors: 6
  sectors:
    Information Technology: [AAPL, MSFT, NVDA, CSCO, ORCL]
    Health Care:            [JNJ, UNH, PFE, MRK, ABT]
    Financials:             [JPM, BAC, WFC, GS, MS]
    Energy:                 [XOM, CVX, COP, SLB, EOG]
    Consumer Staples:       [PG, KO, PEP, WMT, COST]
    Industrials:            [CAT, UNP, HON, LMT, UPS]

# The optimization problem (DECISIONS.md ADR-014, ADR-015). K = N / 2 for every size.
problem:
  in_sample_end: "2020-12-31"   # mu and Sigma are estimated on returns up to this date
  sizes: [8, 10, 12, 14]
  risk_aversion: 4.5            # median "balanced" lambda over 200 instances, rounded (ADR-015)

# Classical baselines (DECISIONS.md ADR-016).
baselines:
  validation_instances_per_size: 50
  simulated_annealing:
    n_steps: 2000
    initial_acceptance: 0.8
    final_temperature_ratio: 0.001
    n_calibration_moves: 100

# QUBO encoding (DECISIONS.md ADR-017): P = (1 + margin) * provable per-cardinality bound.
qubo:
  penalty_margin: 0.01

# QAOA optimization protocol (DECISIONS.md ADR-020). The tuning study chooses depth p, penalty
# scale c (P = c * provable bound) and ramp Delta on separate tuning instances, by the rule
# pre-registered in ADR-020.
qaoa:
  shots: 1024
  max_evaluations: 100
  rhobeg: 0.25
  tuning:
    instances_per_size: 10
    excluded_evaluation_instances: 50   # tuning never uses the first 50 evaluation instances
    layers: [1, 2, 3, 4]
    penalty_scales: [1.0, 0.5, 0.25, 0.1]
    ramp_deltas: [0.75, 1.5]

# Runtime benchmark for noisy simulation (DECISIONS.md ADR-007, ADR-018).
noise_benchmark:
  backend: FakeKingston
  sizes: [8, 10, 12, 14]
  layers: [1, 2]
  shots: 1024
  repeats: 3
  methods: [ideal_statevector, statevector, density_matrix]
  optimization_level: 3
  max_seconds_per_run: 300
  max_memory_mb: 6000

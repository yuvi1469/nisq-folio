# Base configuration shared by every experiment. Experiment configs extend this file.
# Relative paths are resolved against the directory containing this file (configs/).
# No paths are hardcoded in source.

paths:
  data_dir: ../data
  results_dir: ../results

# Root seed. Child seeds for each run are derived from it explicitly
# (numpy.random.SeedSequence) and passed as arguments; global RNG state is never set.
# See DECISIONS.md ADR-004.
seed: 20150101

# Fixed 30-stock universe, 5 per sector (DECISIONS.md ADR-010).
universe:
  start_date: "2015-01-01"   # inclusive
  end_date: "2023-12-31"     # inclusive
  n_stocks: 30
  n_sectors: 6
  sectors:
    Information Technology: [AAPL, MSFT, NVDA, CSCO, ORCL]
    Health Care:            [JNJ, UNH, PFE, MRK, ABT]
    Financials:             [JPM, BAC, WFC, GS, MS]
    Energy:                 [XOM, CVX, COP, SLB, EOG]
    Consumer Staples:       [PG, KO, PEP, WMT, COST]
    Industrials:            [CAT, UNP, HON, LMT, UPS]

# The optimization problem (DECISIONS.md ADR-014, ADR-015). K = N / 2 for every size.
problem:
  in_sample_end: "2020-12-31"   # mu and Sigma are estimated on returns up to this date
  sizes: [8, 10, 12, 14]
  risk_aversion: 4.5            # median "balanced" lambda over 200 instances, rounded (ADR-015)

# Classical baselines (DECISIONS.md ADR-016).
baselines:
  validation_instances_per_size: 50
  simulated_annealing:
    n_steps: 2000
    initial_acceptance: 0.8
    final_temperature_ratio: 0.001
    n_calibration_moves: 100

# QUBO encoding (DECISIONS.md ADR-017): P = (1 + margin) * provable per-cardinality bound.
qubo:
  penalty_margin: 0.01

# QAOA optimization protocol (DECISIONS.md ADR-020). The tuning study chooses depth p, penalty
# scale c (P = c * provable bound) and ramp Delta on separate tuning instances, by the rule
# pre-registered in ADR-020.
qaoa:
  shots: 1024
  max_evaluations: 100
  rhobeg: 0.25
  tuning:
    instances_per_size: 10
    excluded_evaluation_instances: 50   # tuning never uses the first 50 evaluation instances
    layers: [1, 2, 3, 4]
    penalty_scales: [1.0, 0.5, 0.25, 0.1]
    ramp_deltas: [0.75, 1.5]

# Mixer study (DECISIONS.md ADR-021): same tuning instances and shot/evaluation budget as above.
mixer_study:
  mixers: [x, xy_ring, adapt]
  optimizers: [cobyla, spsa]
  layers: [1, 2, 3, 4]
  x_penalty_scales: [1.0, 0.1]   # the X mixer's ADR-020 choice (0.1) and the provable bound (1.0)
  ramp_delta: 0.75               # ADR-020 selection
  adapt_gradient_shift: 0.3927   # pi / 8
  spsa:
    target_step: 0.2
    perturbation: 0.1
    calibration_samples: 5

# Covariance denoising (DECISIONS.md ADR-022). The "RMT" level of the denoising factor is
# Marchenko-Pastur clipping of the 30-asset universe correlation; instances use its block.
denoise:
  experiment_method: rmt_clip
  evaluation_instances_per_size: 50

# The factorial experiment (DECISIONS.md ADR-024). A cell is (denoising, mixer, noise level, N);
# its replicates are the first `instances_per_size` evaluation instances, shared by every cell.
# Noise levels > 0 run only for `noisy_sizes` (ADR-007). Noise levels are fixed in W10 (ADR-025).
experiment:
  name: main
  sizes: [8, 10, 12, 14]
  noisy_sizes: [8, 10, 12]
  denoising: [none, rmt_clip]
  mixers: [x, xy_ring, adapt]
  noise_levels: [0.0]
  instances_per_size: 30
  backend: FakeKingston
  mixer_settings:            # the ADR-021 selections
    x: {optimizer: cobyla, layers: 2, penalty_scale: 0.1}
    xy_ring: {optimizer: spsa, layers: 1}
    adapt: {optimizer: cobyla, layers: 4}
  classical_sa_budgets: [25, 50, 100, 200, 500, 2000]
  # Seconds per noisy circuit evaluation at m = 1, measured in ADR-023 on this laptop; used only
  # by --estimate. Noiseless evaluations are charged `noiseless_seconds_per_eval`.
  cost_model:
    noiseless_seconds_per_eval: 0.01
    noisy_seconds_per_eval:
      x: {8: 0.17, 10: 1.0, 12: 18.0}
      xy_ring: {8: 0.30, 10: 3.0, 12: 44.0}
      adapt: {8: 0.54, 10: 3.9, 12: 217.0}

# Runtime benchmark for noisy simulation (DECISIONS.md ADR-007, ADR-018).
noise_benchmark:
  backend: FakeKingston
  sizes: [8, 10, 12, 14]
  layers: [1, 2]
  shots: 1024
  repeats: 3
  methods: [ideal_statevector, statevector, density_matrix]
  optimization_level: 3
  max_seconds_per_run: 300
  max_memory_mb: 6000

# Base configuration shared by every experiment. Experiment configs extend this file.
# Relative paths are resolved against the directory containing this file (configs/).
# No paths are hardcoded in source.

paths:
  data_dir: ../data
  results_dir: ../results

# Root seed. Child seeds for each run are derived from it explicitly
# (numpy.random.SeedSequence) and passed as arguments; global RNG state is never set.
# See DECISIONS.md ADR-004.
seed: 20150101

# Fixed 30-stock universe, 5 per sector (DECISIONS.md ADR-010).
universe:
  start_date: "2015-01-01"   # inclusive
  end_date: "2023-12-31"     # inclusive
  n_stocks: 30
  n_sectors: 6
  sectors:
    Information Technology: [AAPL, MSFT, NVDA, CSCO, ORCL]
    Health Care:            [JNJ, UNH, PFE, MRK, ABT]
    Financials:             [JPM, BAC, WFC, GS, MS]
    Energy:                 [XOM, CVX, COP, SLB, EOG]
    Consumer Staples:       [PG, KO, PEP, WMT, COST]
    Industrials:            [CAT, UNP, HON, LMT, UPS]

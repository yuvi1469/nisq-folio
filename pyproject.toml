[project]
name = "nisq-folio"
version = "0.1.0"
description = "Benchmarked hybrid quantum-classical pipeline (RMT denoising -> QUBO -> adaptive-mixer QAOA) for cardinality-constrained portfolio selection under NISQ noise."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yuvaraj Guliani", email = "yuvaraj.bs24dmu057@spjain.org" }]
# Locked to a single minor version so there is exactly one resolution to reproduce.
# See DECISIONS.md ADR-001.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Quantum stack: exact pins, verified together (DECISIONS.md ADR-002).
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.50.0",
    # Scientific / data stack: compatible-release pins; uv.lock holds exact versions.
    "numpy~=2.5.4",
    "pandas~=3.0.6",
    "scipy~=1.18.1",
    "scikit-learn~=1.9.1",
    "statsmodels~=0.15.0",
    "matplotlib~=3.11.2",
    "yfinance~=1.7.0",
    # streamlit 1.65 requires pyarrow <26 and excludes 25.0.0 (DECISIONS.md ADR-002).
    "pyarrow~=25.0.1",
    "pyyaml~=6.0.3",
    "streamlit~=1.65.0",
]

[dependency-groups]
dev = [
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nisq_folio"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "NPY",     # numpy-specific rules (incl. legacy global np.random usage)
    "D",       # pydocstyle
    "ANN",     # type annotations
    "RUF",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests need docstrings on modules only; test functions are self-describing.
"tests/**" = ["D100", "D103", "ANN201"]
"notebooks/**" = ["D", "ANN"]

# ---------------------------------------------------------------- pytest / coverage
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=nisq_folio --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["nisq_folio"]

[tool.coverage.report]
fail_under = 85
show_missing = true
